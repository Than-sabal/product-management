{% extends "base.html" %}

{% block title %}
ダッシュボード - 商品管理システム
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <h2>ダッシュボード</h2>

</div>


<div class="row g-4">

    <div class="col-md-4">

        <div class="card shadow-sm card-counter">

            <div class="card-body">

                <h5 class="card-title">
                    商品
                </h5>

                <p class="display-6">
                    120
                </p>

                <a
                    href="{{ url_for('products') }}"
                    class="btn btn-primary"
                >
                    商品一覧
                </a>

            </div>

        </div>

    </div>


    <div class="col-md-4">

        <div class="card shadow-sm card-counter">

            <div class="card-body">

                <h5 class="card-title">
                    カテゴリ
                </h5>

                <p class="display-6">
                    15
                </p>

                <a
                    href="{{ url_for('categories') }}"
                    class="btn btn-primary"
                >
                    カテゴリ一覧
                </a>

            </div>

        </div>

    </div>


    <div class="col-md-4">

        <div class="card shadow-sm card-counter">

            <div class="card-body">

                <h5 class="card-title">
                    在庫
                </h5>

                <p class="display-6">
                    860
                </p>

                <a
                    href="{{ url_for('stocks') }}"
                    class="btn btn-primary"
                >
                    在庫一覧
                </a>

            </div>

        </div>

    </div>

</div>


<div class="card shadow-sm mt-4">

    <div class="card-body">

        <h5 class="card-title">
            お知らせ
        </h5>

        <p class="text-muted mb-0">
            ここにはシステムからのお知らせが表示されます。
        </p>

    </div>

</div>

{% endblock %}
