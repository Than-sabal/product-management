<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>テスター専用コントロールパネル</title>
<!-- 1. Bootstrap CSS CDN  -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- 2. Bootstrap Icons CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light py-5">
<div class="container" style="max-width: 650px;">

<div class="card border-0 shadow-sm mb-4 rounded-4 overflow-hidden">
<div class="card-header text-white fw-bold py-3 px-4" style="background-color: #2c3e50;">
<i class="bi bi-camera-fill me-2"></i> 人物の撮影 (動画・写真)
</div>
<div class="card-body text-center p-4" style="background-color: #f8f9fa;">
<div class="border border-2 border-secondary rounded-3 p-5 bg-white text-secondary shadow-sm">
<i class="bi bi-image display-4 text-muted mb-2"></i>
<p class="mt-2 mb-0 fw-medium text-muted">撮影された画像・動画がここに表示されます</p>
</div>
</div>
</div>
<!-- 検知情報・通知管理 -->
<div class="card border-0 shadow-sm rounded-4 overflow-hidden">
<div class="card-header text-white fw-bold py-3 px-4" style="background-color: #34495e;">
<i class="bi bi-info-circle-fill me-2"></i> 検知情報・通知管理
</div>
<div class="card-body p-4 bg-white">
<ul class="list-group list-group-flush">
<li class="list-group-item d-flex justify-content-between align-items-center py-3 border-light">
<span class="fw-bold text-secondary">ステータス:</span>
<span class="badge rounded-pill px-3 py-2 text-white fw-semibold" style="background-color: #e74c3c; font-size: 0.9rem;">金属検知 (異常あり)</span>
</li>
<li class="list-group-item d-flex justify-content-between align-items-center py-3 border-light">
<span class="fw-bold text-secondary">検知日時:</span>
<span class="text-dark fw-medium">2026-10-15 10:00:00</span>
</li>
<li class="list-group-item d-flex justify-content-between align-items-center py-3 border-0">
<span class="fw-bold text-secondary">データ送信:</span>
<span class="badge rounded-pill px-3 py-2 text-white fw-semibold" style="background-color: #27ae60; font-size: 0.9rem;">管理者に送信完了</span>
</li>
</ul>
</div>
</div>
</div>
<!-- Bootstrap JS (Optional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
