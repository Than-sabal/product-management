<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>iPhone方位センサーテスト</title>
</head>
<body>
    <h2>iPhone方位センサーテスト</h2>
    <p>ボタンを押してセンサーの利用を許可してください。</p>

    <button id="startButton">センサーを開始</button>
    <p id="status">待機中</p>

    <h3>方位：<span id="heading">--</span>°</h3>
    <p>α：<span id="alpha">--</span></p>
    <p>β：<span id="beta">--</span></p>
    <p>γ：<span id="gamma">--</span></p>

    <script>
        const status = document.getElementById("status");
        const startButton = document.getElementById("startButton");

        let listening = false;

        function showValue(id, value) {
            document.getElementById(id).textContent =
                value == null ? "取得不可" :
                Number.isFinite(value) ? value.toFixed(1) :
                "取得不可";
        }

        function handleOrientation(event) {
            showValue("alpha", event.alpha);
            showValue("beta", event.beta);
            showValue("gamma", event.gamma);

            // iOS Safariで利用できる場合のコンパス方位
            const heading = event.webkitCompassHeading;

            if (Number.isFinite(heading)) {
                showValue("heading", heading);
            } else if (Number.isFinite(event.alpha)) {
                // alphaは端末の向きを示す値で、コンパス方位とは別物
                document.getElementById("heading").textContent =
                    "未対応";
            } else {
                document.getElementById("heading").textContent =
                    "取得不可";
            }

            if (
                event.alpha == null &&
                event.beta == null &&
                event.gamma == null
            ) {
                status.textContent =
                    "イベント受信中ですが、センサー値は取得できません";
            } else {
                status.textContent =
                    "センサー値を取得しました";
            }
        }

        startButton.addEventListener("click", async () => {
            if (listening) return;

            if (!window.isSecureContext) {
                status.textContent =
                    "HTTPS接続が必要です。";
                return;
            }

            if (!("DeviceOrientationEvent" in window)) {
                status.textContent =
                    "このブラウザーは方位センサーに対応していません。";
                return;
            }

            try {
                if (
                    typeof DeviceOrientationEvent.requestPermission
                    === "function"
                ) {
                    const permission =
                        await DeviceOrientationEvent.requestPermission();

                    if (permission !== "granted") {
                        status.textContent =
                            "センサーの利用が許可されませんでした。";
                        return;
                    }
                }

                window.addEventListener(
                    "deviceorientation",
                    handleOrientation
                );

                listening = true;
                startButton.disabled = true;
                status.textContent =
                    "センサーのデータを待っています。";
            } catch (error) {
                status.textContent =
                    "エラー：" + error.message;
            }
        });
    </script>
</body>
</html>
