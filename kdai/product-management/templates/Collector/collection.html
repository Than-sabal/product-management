
{% extends "base.html" %}

{% block title %}回収員画面{% endblock %}

{% block content %}
<script>
    setTimeout(function () {
        window.location.reload();
    }, 3000);
</script>
<div class="container mt-4">
    <h2 class="mb-4">回収員 メニュー・検知一覧</h2>

    <!-- 未回収の危険物一覧 -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-warning text-dark fw-bold">
            未回収の危険物一覧 (回収対象)
        </div>

        <div class="card-body">
            <div class="list-group">
                {% for item in detections %}
                <div class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="mb-1">
                            {{ item.item_name }} ({{ item.location }})
                        </h5>
                        <small class="text-muted">
                            検知時刻: {{ item.detected_at }}
                        </small>
                    </div>
                    <div class="d-flex align-items-center gap-2">

                        <!-- 詳細ボタン -->
                        <a href="{{ url_for('collection_detail', request_id=item.id) }}"
                        class="btn btn-outline-success rounded-pill"
                        style="font-size: 16px; padding: 9px 20px;">
                            詳細を見る
                        </a>

                        <!-- 回収完了ボタン -->
                        <form action="{{ url_for('collection_send_report') }}"
                            method="POST"
                            class="m-0">
                            <input type="hidden" name="request_id" value="{{ item.id }}">

                            <button type="submit"
                                    class="btn btn-success rounded-pill"
                                    style="font-size: 16px; padding: 9px 20px;">
                                回収完了を報告する
                            </button>
                        </form>

                    </div>
                {% else %}
                <div class="list-group-item text-muted text-center py-3">
                    現在、未回収の危険物はありません。
                </div>
                {% endfor %}
            </div>
        </div>
    </div>

    <!-- 画面下部のナビゲーション -->
    <div class="d-flex justify-content-between">
        <a href="{{ url_for('collection_history') }}"
           class="btn btn-outline-secondary">
            📋 過去の報告履歴を見る
        </a>

    </div>
</div>
{% endblock %}
