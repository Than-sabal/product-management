{% extends "base.html" %}

{% block title %}

回収員へ報告 - ごみ分別ナビ

{% endblock %}

{% block content %}
<div class="container mt-4" style="max-width: 600px;">
<h2>📤 回収員への報告</h2>
<p class="text-muted">検知された危険物について回収員へ報告を行います。</p>
<div class="card shadow-sm border-0 rounded-4 mt-4">
<div class="card-body p-4">
<form action="{{ url_for('send_report') }}" method="POST">
<!-- 送信先  -->
<div class="mb-3">
<label class="form-label fw-bold">送信先 (回収員・担当者名)</label>
<input type="text" name="target" class="form-control" placeholder="" value="" required>
</div>
<div class="mb-3">
<label class="form-label fw-bold">報告内容 / メモ</label>
<textarea name="memo" class="form-control" rows="3" placeholder="回収に関する指示やメモを入力してください"></textarea>
</div>
<div class="d-flex justify-content-between align-items-center mt-4">
<a href="{{ url_for('alerts') }}" class="btn btn-outline-secondary rounded-pill px-4">戻る</a>
<button type="submit" class="btn btn-danger rounded-pill px-4 fw-bold shadow-sm">
<i class="bi bi-send-fill me-1"></i> 報告を送信する
</button>
</div>
</form>
</div>
</div>
</div>

{% endblock %}
