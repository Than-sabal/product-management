{% extends "base.html" %}

{% block title %}

テスター専用コントロールパネル - ごみ分別ナビ

{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 650px;">
<div class="card shadow-lg border-0 rounded-4 p-5 text-center bg-white">
<h2 class="mb-4 text-primary fw-bold">
<i class="bi bi-sliders me-2"></i> テスター専用コントロールパネル
</h2>
<form action="{{ url_for('trigger_test_alert') }}" method="POST">
<button type="submit" class="btn btn-danger btn-lg px-5 py-4 rounded-pill fw-bold shadow-lg fs-4 w-100">
<i class="bi bi-exclamation-triangle-fill me-2"></i> 🚨 金属検知テストを実行する
</button>
</form>
<div class="mt-4">

            {% if has_alert %}
<div class="alert alert-danger mt-3 shadow-sm rounded-3 py-3" role="alert">

                ⚠️ ユースケース図の処理（警告表示・人物撮影・情報保存・情報送信）が正常に実行されました！
</div>

            {% endif %}
</div>
</div>
</div>

{% endblock %}
