<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン | Pattern 2</title>
<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
<div class="container">
<div class="row justify-content-center">
<div class="col-md-8 col-lg-7">
<div class="card shadow-lg border-0 overflow-hidden rounded-4">
<div class="row g-0">
<!-- Left Side Illustration/Brand -->
<div class="col-md-5 bg-success text-white p-4 d-flex flex-column justify-content-center text-center">
<div class="display-4 mb-2">♻️</div>
<h4 class="fw-bold">ごみ分別ナビ</h4>
<p class="small opacity-75 mb-0">スマートなゴミ分別・回収管理システム</p>
</div>
<!-- Right Side Form -->
<div class="col-md-7 p-4 p-md-5 bg-white">
<h4 class="fw-bold text-dark mb-4">ログイン</h4>
<form action="{{ url_for('login') }}" method="POST">
<div class="mb-3 text-start">
<label class="form-label text-secondary small fw-bold">ID / メールアドレス</label>
<input type="text" class="form-control bg-light" placeholder="than@gmail.com" required>
</div>
<div class="mb-4 text-start">
<label class="form-label text-secondary small fw-bold">パスワード</label>
<input type="password" class="form-control bg-light" placeholder="••••••••" required>
</div>
<button type="submit" class="btn btn-success w-100 fw-bold py-2 shadow-sm">
                               ログインする
</button>
</form>
</div>
</div>
</div>
</div>
</div>
</div>
</body>
</html>
