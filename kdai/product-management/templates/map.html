
{% extends "base.html" %}

{% block title %}全国マップ | ごみ分別ナビ{% endblock %}

{% block content %}

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
.map-container {
    padding: 20px;
    max-width: 1500px;
    margin: auto;
}

.map-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 15px;
}

.map-header h2 {
    font-weight: 700;
    margin: 0;
}

#map {
    width: 100%;
    height: 75vh;
    min-height: 500px;
    border-radius: 16px;
    border: 1px solid #ddd;
    z-index: 1;
}

.map-controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.map-btn {
    border: none;
    border-radius: 9px;
    padding: 10px 15px;
    background: #198754;
    color: white;
    font-weight: 600;
    cursor: pointer;
}

.map-btn:hover {
    opacity: .85;
}

.map-btn:disabled {
    opacity: .5;
    cursor: not-allowed;
}

/* 検知ピン */
.detection-pin {
    position: relative;
    width: 30px;
    height: 40px;
}

.detection-pin .pin-head {
    position: absolute;
    top: 0;
    left: 3px;
    width: 24px;
    height: 24px;
    background: #ec168c;
    border: 2px solid white;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    box-shadow: 0 2px 5px rgba(0,0,0,.35);
}

.detection-pin .pin-head::after {
    content: "";
    position: absolute;
    width: 8px;
    height: 8px;
    top: 6px;
    left: 6px;
    background: white;
    border-radius: 50%;
}

/* 接近時の赤い点滅 */
.detection-pin.nearby .pin-head {
    background: #ff0000;
    animation: pin-alert .8s infinite;
    box-shadow:
        0 0 0 5px rgba(255,0,0,.2),
        0 0 15px rgba(255,0,0,.9);
}

@keyframes pin-alert {
    0%, 100% {
        transform: rotate(-45deg) scale(1);
    }
    50% {
        transform: rotate(-45deg) scale(1.35);
    }
}

/* 接近警告 */
.proximity-alert {
    display: none;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 12px;
    background: #fff0f0;
    border: 2px solid #dc3545;
    color: #b02a37;
    font-weight: bold;
    animation: alert-bg 1.2s infinite;
}

@keyframes alert-bg {
    0%, 100% { background: #fff0f0; }
    50% { background: #ffdada; }
}

.gps-status {
    margin-top: 12px;
    padding: 12px;
    border-radius: 10px;
    background: #f1f7ff;
    border: 1px solid #cfe2ff;
    font-size: 14px;
}

.map-popup {
    min-width: 220px;
    max-width: 270px;
}

.map-popup-title {
    font-size: 16px;
    font-weight: bold;
    color: #d41478;
    margin-bottom: 8px;
}

.map-popup-photo {
    width: 100%;
    max-height: 140px;
    object-fit: contain;
    background: #f1f1f1;
    border-radius: 7px;
    margin-bottom: 8px;
}

.map-popup-info {
    font-size: 13px;
    line-height: 1.8;
}

.map-detail-btn {
    display: block;
    text-align: center;
    background: #198754;
    color: white !important;
    padding: 8px;
    border-radius: 20px;
    text-decoration: none;
    margin-top: 10px;
    font-weight: bold;
}

.map-detail-btn:hover {
    background: #146c43;
}

.map-info {
    margin-top: 15px;
    padding: 14px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 12px;
}

.map-legend {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    font-size: 14px;
    margin-top: 10px;
}

.legend-dot {
    display: inline-block;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    margin-right: 5px;
}

@media(max-width: 600px) {
    #map {
        height: 65vh;
        min-height: 400px;
    }

    .map-btn {
        padding: 9px 11px;
        font-size: 13px;
    }
}
</style>

<div class="map-container">

    <div class="map-header">
        <h2>🗾 ごみ分別ナビ 全国マップ</h2>

        <div class="map-controls">
            <button class="map-btn" onclick="changeMap('normal')">
                標準マップ
            </button>

            <button class="map-btn" onclick="changeMap('satellite')">
                航空写真
            </button>

            <button class="map-btn" id="gpsButton"
                    onclick="showCurrentLocation()">
                📍 GPS開始
            </button>

            <button class="map-btn" id="gpsStopButton"
                    onclick="stopGPS()" style="display:none;background:#6c757d;">
                GPS停止
            </button>
        </div>
    </div>

    <!-- 接近警告 -->
    <div id="proximityAlert" class="proximity-alert">
        ⚠️ 近くに危険物があります！
        <div id="alertDetails" class="mt-2"></div>
    </div>

    <div id="map"></div>

    <!-- GPS状態 -->
    <div class="gps-status">
        <div id="gpsStatus">
            📍 GPSは停止中です。「GPS開始」を押してください。
        </div>
        <div id="gpsDistance" class="mt-1 text-muted"></div>
    </div>

    <div class="map-info">
        <strong>📌 検知場所の状態</strong>

        <div class="map-legend">
            <span><i class="legend-dot" style="background:#dc3545"></i>未対応</span>
            <span><i class="legend-dot" style="background:#ffc107"></i>回収依頼中</span>
            <span><i class="legend-dot" style="background:#198754"></i>回収済み</span>
            <span><i class="legend-dot" style="background:red"></i>接近中</span>
            <span><i style="display:inline-block;width:18px;height:10px;border:2px dashed #dc3545;background:rgba(220,53,69,.10);margin-right:5px;"></i>検知場所から半径100m</span>
        </div>

        <p class="text-muted mt-2 mb-0">
            赤い点線の円は検知場所から半径100mの範囲です。円の中に近づくと、検知ピンが赤く点滅します。
        </p>
    </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ==============================
// 地図初期設定
// ==============================

const map = L.map('map').setView([36.2048, 138.2529], 5);

const normalLayer = L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
    }
);

const satelliteLayer = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {
        maxZoom: 19,
        attribution: 'Tiles &copy; Esri'
    }
);

normalLayer.addTo(map);

function changeMap(type) {
    if (map.hasLayer(normalLayer)) {
        map.removeLayer(normalLayer);
    }

    if (map.hasLayer(satelliteLayer)) {
        map.removeLayer(satelliteLayer);
    }

    if (type === 'satellite') {
        satelliteLayer.addTo(map);
    } else {
        normalLayer.addTo(map);
    }
}

// ==============================
// GPS設定
// ==============================

// 接近判定距離（メートル）
const ALERT_DISTANCE = 100;

// 再度警告するために離れる距離
const RESET_DISTANCE = 120;

let currentMarker = null;
let accuracyCircle = null;
let watchId = null;

let currentPosition = null;

// 接近中の危険物ID
const nearbyItems = new Set();

// 一度警告した危険物ID
const alertedItems = new Set();

// ==============================
// GPS開始
// ==============================

function showCurrentLocation() {

    if (!navigator.geolocation) {
        alert('このブラウザはGPSに対応していません。');
        return;
    }

    if (watchId !== null) {
        return;
    }

    document.getElementById('gpsStatus').textContent =
        '📡 パソコンの位置情報を取得しています...';

    watchId = navigator.geolocation.watchPosition(

        function(position) {

            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const accuracy = position.coords.accuracy;

            currentPosition = L.latLng(lat, lng);

            // 現在地マーカー
            if (!currentMarker) {

                currentMarker = L.circleMarker(
                    [lat, lng],
                    {
                        radius: 9,
                        color: '#ffffff',
                        weight: 3,
                        fillColor: '#1677ff',
                        fillOpacity: 1
                    }
                ).addTo(map);

                currentMarker.bindPopup('📍 現在地');

                map.setView([lat, lng], 16);

            } else {

                currentMarker.setLatLng([lat, lng]);

            }

            // GPS精度の範囲
            if (!accuracyCircle) {

                accuracyCircle = L.circle(
                    [lat, lng],
                    {
                        radius: accuracy,
                        color: '#1677ff',
                        fillColor: '#1677ff',
                        fillOpacity: 0.08,
                        weight: 1
                    }
                ).addTo(map);

            } else {

                accuracyCircle.setLatLng([lat, lng]);
                accuracyCircle.setRadius(accuracy);

            }

            document.getElementById('gpsStatus').textContent =
                '🟢 GPS稼働中｜現在地を取得しています';

            document.getElementById('gpsDistance').textContent =
                'GPS精度：約' + Math.round(accuracy) + 'm';

            document.getElementById('gpsButton').style.display = 'none';
            document.getElementById('gpsStopButton').style.display = 'inline-block';

            // 接近判定
            checkNearbyDetections();

        },

        function(error) {

            let message = 'GPSを取得できませんでした。';

            if (error.code === 1) {
                message = '位置情報が許可されていません。WindowsとEdgeの位置情報の許可を確認してください。';
            } else if (error.code === 2) {
                message = '現在地を取得できません。';
            } else if (error.code === 3) {
                message = 'GPSの取得がタイムアウトしました。';
            }

            document.getElementById('gpsStatus').textContent =
                '🔴 ' + message;

        },

        {
            enableHighAccuracy: true,
            maximumAge: 3000,
            timeout: 20000
        }

    );

    // watchPositionのIDは同期的に取得される
    // ただし、非同期の位置情報取得は継続する
}

// ==============================
// GPS停止
// ==============================

function stopGPS() {

    if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
    }

    currentPosition = null;

    if (currentMarker) {
        map.removeLayer(currentMarker);
        currentMarker = null;
    }

    if (accuracyCircle) {
        map.removeLayer(accuracyCircle);
        accuracyCircle = null;
    }

    nearbyItems.clear();
    alertedItems.clear();

    // ピンの点滅解除
    detectionMarkers.forEach(marker => {
        const element = marker.getElement();

        if (element) {
            element.querySelector('.detection-pin')
                ?.classList.remove('nearby');
        }
    });

    document.getElementById('proximityAlert').style.display = 'none';

    document.getElementById('gpsStatus').textContent =
        '📍 GPSは停止中です。';

    document.getElementById('gpsDistance').textContent = '';

    document.getElementById('gpsButton').style.display = 'inline-block';
    document.getElementById('gpsStopButton').style.display = 'none';
}

// ==============================
// Flaskから検知データを取得
// ==============================

const detectionData = {{ detections | tojson }};

const uploadBaseUrl =
    {{ url_for('static', filename='uploads/') | tojson }};

const detailBaseUrl =
    {{ url_for('collection_detail') | tojson }};

function escapeHTML(value) {

    return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
    })[char]);

}

function getMarkerColor(status) {

    if (status === '回収済み' || status === '対応済み') {
        return '#198754';
    }

    if (status === '回収依頼中') {
        return '#ffc107';
    }

    return '#dc3545';
}

// ==============================
// ピンアイコン
// ==============================

const pinkPinIcon = L.divIcon({

    className: '',

    html: `
        <div class="detection-pin">
            <div class="pin-head"></div>
        </div>
    `,

    iconSize: [30, 40],
    iconAnchor: [15, 40],
    popupAnchor: [0, -38]

});

const markerBounds = [];

// 検知ピンとデータを保持
const detectionMarkers = [];

// 各検知地点を中心とした半径100mの円
const detectionRangeCircles = [];

// ==============================
// 検知位置を地図に表示
// ==============================

detectionData.forEach(item => {

    if (item.latitude == null || item.longitude == null) {
        return;
    }

    const lat = Number(item.latitude);
    const lng = Number(item.longitude);

    if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lng) ||
        lat < -90 || lat > 90 ||
        lng < -180 || lng > 180
    ) {
        return;
    }

    const status = item.status || '未対応';

    // 検知場所を中心に半径100mの範囲を地図へ表示
    const rangeCircle = L.circle(
        [lat, lng],
        {
            radius: 100,
            color: '#dc3545',
            weight: 2,
            opacity: 0.9,
            dashArray: '6, 6',
            fillColor: '#dc3545',
            fillOpacity: 0.10
        }
    ).addTo(map);

    rangeCircle.bindPopup(
        `<strong>100m接近警告範囲</strong><br>${escapeHTML(item.item_name)}`
    );

    detectionRangeCircles.push(rangeCircle);

    const marker = L.marker(
        [lat, lng],
        { icon: pinkPinIcon }
    ).addTo(map);

    markerBounds.push([lat, lng]);

    // 写真
    let photoHtml = '';

    if (item.photo) {

        const photoUrl = uploadBaseUrl +
            encodeURIComponent(item.photo);

        photoHtml = `
            <img
                src="${escapeHTML(photoUrl)}"
                class="map-popup-photo"
                alt="検知写真"
                onerror="this.style.display='none';"
            >
        `;

    }

    // 詳細画面
    let detailHtml = '';

    if (item.request_id) {

        const detailUrl = detailBaseUrl +
            '?request_id=' +
            encodeURIComponent(item.request_id);

        detailHtml = `
            <a class="map-detail-btn"
               href="${escapeHTML(detailUrl)}">
                詳細を見る ➜
            </a>
        `;

    }

    const popupContent = `
        <div class="map-popup">

            <div class="map-popup-title">
                📍 ${escapeHTML(item.item_name)}
            </div>

            ${photoHtml}

            <div class="map-popup-info">

                <strong>場所：</strong>
                ${escapeHTML(item.location)}<br>

                <strong>状態：</strong>

                <span style="color:${getMarkerColor(status)};font-weight:bold;">
                    ${escapeHTML(status)}
                </span><br>

                <strong>検知日時：</strong>
                ${escapeHTML(item.detected_at)}<br>

                <strong>備考：</strong>
                ${escapeHTML(item.message || 'なし')}

            </div>

            ${detailHtml}

        </div>
    `;

    marker.bindPopup(popupContent);

    detectionMarkers.push({
        id: String(item.id),
        name: item.item_name,
        marker: marker,
        position: L.latLng(lat, lng)
    });

});

// ==============================
// 接近距離の計算
// ==============================

function checkNearbyDetections() {

    if (!currentPosition) {
        return;
    }

    const newlyNearby = [];
    const nowNearby = new Set();

    detectionMarkers.forEach(item => {

        // GPS現在地から危険物までの距離
        const distance = currentPosition.distanceTo(
            item.position
        );

        const pinElement = item.marker.getElement();

        if (!pinElement) {
            return;
        }

        const pin = pinElement.querySelector('.detection-pin');

        if (!pin) {
            return;
        }

        // 100m以内
        if (distance <= ALERT_DISTANCE) {

            nowNearby.add(item.id);

            pin.classList.add('nearby');

            // 初回接近時だけ警告
            if (!alertedItems.has(item.id)) {

                newlyNearby.push({
                    id: item.id,
                    name: item.name,
                    distance: Math.round(distance)
                });

                alertedItems.add(item.id);

            }

        } else {

            pin.classList.remove('nearby');

            // 120m以上離れたら再通知可能にする
            if (distance > RESET_DISTANCE) {
                alertedItems.delete(item.id);
            }

        }

    });

    nearbyItems.clear();

    nowNearby.forEach(id => {
        nearbyItems.add(id);
    });

    // 接近警告表示
    updateProximityAlert(newlyNearby);

}

// ==============================
// 接近警告画面
// ==============================

function updateProximityAlert(newItems) {

    const alertBox = document.getElementById('proximityAlert');
    const alertDetails = document.getElementById('alertDetails');

    if (nearbyItems.size === 0) {

        alertBox.style.display = 'none';
        return;

    }

    alertBox.style.display = 'block';

    const names = detectionMarkers
        .filter(item => nearbyItems.has(item.id))
        .map(item => {

            const distance = Math.round(
                currentPosition.distanceTo(item.position)
            );

            return `
                <div>
                    ⚠️ ${escapeHTML(item.name)}
                    （約${distance}m）
                </div>
            `;

        });

    alertDetails.innerHTML = names.join('');

    // 新しく接近した場合、該当ピンを表示
    if (newItems.length > 0) {

        const first = detectionMarkers.find(
            item => item.id === newItems[0].id
        );

        if (first) {
            first.marker.openPopup();
        }

    }

}

// ==============================
// 初期表示
// ==============================

if (markerBounds.length > 0) {

    map.fitBounds(markerBounds, {
        padding: [40, 40],
        maxZoom: 12
    });

}

</script>

{% endblock %}
