{% extends "base.html" %}

{% block title %}回収員画面{% endblock %}

{% block content %}

<script>
    setTimeout(function () {
        window.location.reload();
    }, 3000);
</script>

<style>
    /* 危険物一覧 */
    .danger-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    /* 危険物1件ごとの行 */
    .danger-item {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 16px 20px;
        border: 1px solid #dee2e6;
        border-radius: 10px;
        background: #fff;
        box-sizing: border-box;
    }

    .danger-info {
        flex: 1;
        min-width: 0;
    }

    .danger-info h5 {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 8px;
        overflow-wrap: anywhere;
    }

    .danger-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
    }

    .danger-actions .btn {
        font-size: 16px;
        padding: 12px 22px;
        white-space: normal;
        min-width: 120px;
    }

    @media (max-width: 768px) {
        .danger-item {
            flex-direction: column;
            align-items: stretch;
        }

        .danger-actions {
            width: 100%;
        }

        .danger-actions .btn {
            flex: 1;
        }
    }
</style>

<div class="container mt-4">

    <h2 class="mb-4">回収員 メニュー・検知一覧</h2>

    <!-- 未回収の危険物一覧 -->
    <div class="card shadow-sm mb-4">

        <div class="card-header bg-warning text-dark fw-bold">
            未回収の危険物一覧 (回収対象)
        </div>

        <div class="card-body">

            <div class="danger-list">

                {% for item in detections %}

                <!-- 危険物1件分 -->
                <div class="danger-item">

                    <!-- 危険物情報 -->
                    <div class="danger-info">

                        <h5>
                            {{ item.item_name }}（{{ item.location }}）
                        </h5>

                        <small class="text-muted">
                            検知時刻: {{ item.detected_at }}
                        </small>

                    </div>

                    <!-- 操作ボタン -->
                    <div class="danger-actions">

                        <!-- 詳細ボタン -->
                        <a href="{{ url_for('collection_detail', request_id=item.id) }}"
                           class="btn btn-outline-success rounded-pill">
                            詳細を見る
                        </a>

                        <!-- 回収完了ボタン -->
                        <form action="{{ url_for('collection_send_report') }}"
                              method="POST"
                              class="m-0">

                            <input type="hidden"
                                   name="request_id"
                                   value="{{ item.id }}">

                            <button type="submit"
                                    class="btn btn-success rounded-pill">
                                回収完了を報告する
                            </button>

                        </form>

                    </div>

                </div>
                <!-- ここで1件分の行を閉じる -->

                {% else %}

                <div class="text-muted text-center py-3">
                    現在、未回収の危険物はありません。
                </div>

                {% endfor %}

            </div>

        </div>
    </div>

    <!-- 過去の報告履歴 -->
    <div class="d-flex justify-content-between">

        <a href="{{ url_for('collection_history') }}"
           class="btn btn-outline-secondary">
            📋 過去の報告履歴を見る
        </a>

    </div>

</div>

{% endblock %}
