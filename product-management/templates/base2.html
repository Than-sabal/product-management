<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}回収員システム{% endblock %}</title>
<!-- Bootstrap CSS & Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
<style>
 
        body {
 
            min-height: 100vh;
 
            transition: background 0.8s ease, color 0.5s ease;
 
        }
 
        /* 🌿 1. Safe State: စံပယ်ရွေးထားသော သန့်ရှင်းစိမ်းလန်းသည့် ပုံကို Background ထည့်ခြင်း */
 
        body.theme-safe {
 
            /* စာသားများ ဖတ်ရလွယ်ကူစေရန် အပေါ်မှ အဖြူရောင်အလွှာပါးပါးလေး (0.35) အုပ်ထားပါသည် */
 
            background: linear-gradient(rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0.45)),
 
                        url("{{ url_for('static', filename='images/clean_bg.jpg') }}") no-repeat center center fixed !important;
 
            background-size: cover !important;
 
        }
 
        body.theme-safe .navbar-dynamic {
 
            background-color: rgba(46, 125, 50, 0.88) !important;
 
            backdrop-filter: blur(8px);
 
            transition: background-color 0.8s ease;
 
        }
 
        /* 🚨 2. Alert State: အန္တရာယ်ရှိအမှိုက် တွေ့ရှိချိန် (သတိပေး Vibe) */
 
        body.theme-alert {
 
            background: linear-gradient(135deg, #fff3e0 0%, #ffebee 50%, #fce4ec 100%) !important;
 
        }
 
        body.theme-alert .navbar-dynamic {
 
            background-color: rgba(183, 28, 28, 0.92) !important;
 
            backdrop-filter: blur(8px);
 
            transition: background-color 0.8s ease;
 
        }
 
        /* ✨ Card တွေကို နောက်ခံပုံလေး ဖောက်မြင်ရအောင် Glass Effect ထည့်ခြင်း */
 
        .card {
 
            background-color: rgba(255, 255, 255, 0.82) !important;
 
            backdrop-filter: blur(10px);
 
            -webkit-backdrop-filter: blur(10px);
 
            border: 1px solid rgba(255, 255, 255, 0.6) !important;
 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06) !important;
 
        }
 
        /* Menu Hover Effect */
 
        .hover-bg:hover {
 
            background-color: rgba(255, 255, 255, 0.15);
 
            transition: background-color 0.2s ease;
 
        }
 
        /* 🌿 သစ်ရွက်လေး လှုပ်ရှားနေမည့် Animation */
 
        @keyframes gentleFloat {
 
            0%, 100% { transform: translateY(0px) rotate(0deg); }
 
            50% { transform: translateY(-6px) rotate(4deg); }
 
        }
 
        .floating-leaf {
 
            display: inline-block;
 
            animation: gentleFloat 3s ease-in-out infinite;
 
        }
 
        /* 🚨 Alert ဖြစ်နေချိန် ခုန်နေမည့် Animation */
 
        @keyframes pulseAlert {
 
            0% { transform: scale(1); }
 
            50% { transform: scale(1.08); }
 
            100% { transform: scale(1); }
 
        }
 
        .pulse-icon {
 
            display: inline-block;
 
            animation: pulseAlert 1.5s infinite;
 
        }
</style>
 
    {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}theme-safe{% endblock %}">
<!-- Navbar -->
<nav class="navbar navbar-dark navbar-dynamic px-3 shadow-sm mb-4">
<div class="container-fluid">
<button class="btn text-white border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuOffcanvas">
<i class="bi bi-list fs-3"></i>
</button>
<span class="navbar-brand mb-0 h1 fw-bold">
<i class="bi bi-truck text-warning me-2"></i> 回収員システム
</span>
<div>
<a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm rounded-pill px-3">
<i class="bi bi-box-arrow-right me-1"></i> ログアウト
</a>
</div>
</div>
</nav>
<!-- Offcanvas Menu -->
<div class="offcanvas offcanvas-start bg-dark text-white" tabindex="-1" id="menuOffcanvas">
<div class="offcanvas-header border-bottom border-secondary">
<h5 class="offcanvas-title fw-bold">
<i class="bi bi-menu-app me-2 text-warning"></i> メニュー
</h5>
<button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
</div>
<div class="offcanvas-body">
<ul class="nav flex-column gap-2">
<li class="nav-item">
<a href="{{ url_for('collection_view') }}" class="nav-link text-white py-2 px-3 rounded hover-bg">
<i class="bi bi-house-door me-2 text-info"></i> ダッシュボード
</a>
</li>
<li class="nav-item">
<a href="{{ url_for('collection_history') }}" class="nav-link text-white py-2 px-3 rounded hover-bg">
<i class="bi bi-clock-history me-2 text-warning"></i> 検知履歴を確認する
</a>
</li>
</ul>
</div>
</div>
<!-- 🖥️ Main Content -->
<div class="container pb-5" style="max-width: 1000px;">
 
        {% block content %}{% endblock %}
</div>
<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
 
    {% block extra_js %}{% endblock %}
</body>
</html>
