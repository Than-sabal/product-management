
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>iPhone磁気・方位センサーテスト</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
            color: #263238;
            background: #f5f7fa;
        }

        h2, h3 {
            color: #263238;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .sensor-data {
            padding: 12px;
            margin: 10px 0;
            background: #f1f5f9;
            border-radius: 8px;
        }

        button {
            padding: 12px 18px;
            margin: 6px 4px 6px 0;
            border: none;
            border-radius: 8px;
            background: #1976d2;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            background: #9e9e9e;
            cursor: not-allowed;
        }

        #status, #saveStatus {
            overflow-wrap: anywhere;
            font-weight: bold;
        }

        #saveStatus {
            color: #1976d2;
        }
    </style>
</head>

<body>
<div class="container">
    <h2>iPhone磁気・方位センサーテスト</h2>

    <p>
        ボタンを押して、iPhoneのセンサーを開始してください。
    </p>

    <button id="startButton">センサーを開始</button>

    <p id="status">待機中</p>

    <hr>

    <h3>磁気データ</h3>

    <div class="sensor-data">
        <p>X：<span id="magX">--</span> μT</p>
        <p>Y：<span id="magY">--</span> μT</p>
        <p>Z：<span id="magZ">--</span> μT</p>
    </div>

    <button id="saveButton" disabled>
        磁気データを保存
    </button>

    <p id="saveStatus"></p>

    <hr>

    <h3>方位・端末の傾き</h3>

    <div class="sensor-data">
        <p>方位：<span id="heading">--</span></p>
        <p>α：<span id="alpha">--</span></p>
        <p>β：<span id="beta">--</span></p>
        <p>γ：<span id="gamma">--</span></p>
    </div>
</div>

<script>
    const status = document.getElementById("status");
    const startButton = document.getElementById("startButton");
    const saveButton = document.getElementById("saveButton");
    const saveStatus = document.getElementById("saveStatus");

    let listening = false;
    let magnetometer = null;
    let latestMagneticData = null;
    let magneticAvailable = false;
    let orientationAvailable = false;

    // 数値を画面に表示
    function showValue(id, value) {
        document.getElementById(id).textContent =
            typeof value === "number" && Number.isFinite(value)
                ? value.toFixed(2)
                : "取得不可";
    }

    // 方位・傾きデータを取得
    function handleOrientation(event) {
        orientationAvailable = true;

        showValue("alpha", event.alpha);
        showValue("beta", event.beta);
        showValue("gamma", event.gamma);

        if (Number.isFinite(event.webkitCompassHeading)) {
            document.getElementById("heading").textContent =
                event.webkitCompassHeading.toFixed(1) + "°";
        } else {
            document.getElementById("heading").textContent =
                "コンパス方位は未対応";
        }

        updateStatus();
    }

    // 磁気データの取得状態を表示
    function updateStatus() {
        if (magneticAvailable && orientationAvailable) {
            status.textContent =
                "磁気データと方位データを取得しています。";
        } else if (magneticAvailable) {
            status.textContent =
                "磁気データを取得しています。";
        } else if (orientationAvailable) {
            status.textContent =
                "方位データを取得しています。磁気データは未取得です。";
        }
    }

    // 磁気データを取得
    function handleMagneticReading() {
        latestMagneticData = {
            x: magnetometer.x,
            y: magnetometer.y,
            z: magnetometer.z
        };

        showValue("magX", latestMagneticData.x);
        showValue("magY", latestMagneticData.y);
        showValue("magZ", latestMagneticData.z);

        magneticAvailable = true;
        saveButton.disabled = false;

        updateStatus();
    }

    // 磁気データをFlaskに送信して保存
    async function saveMagneticData() {
        if (!latestMagneticData) {
            saveStatus.textContent =
                "磁気データを取得できていません。";
            return;
        }

        saveButton.disabled = true;
        saveStatus.textContent = "保存しています...";

        try {
            const response = await fetch("/api/detections", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    magnetic_x: latestMagneticData.x,
                    magnetic_y: latestMagneticData.y,
                    magnetic_z: latestMagneticData.z,
                    location: "iPhoneセンサーテスト"
                })
            });

            const result = await response.json().catch(() => ({}));

            if (!response.ok) {
                throw new Error(
                    result.message ||
                    result.error ||
                    "HTTPエラー：" + response.status
                );
            }

            saveStatus.textContent =
                "データを保存しました！";

        } catch (error) {
            saveStatus.textContent =
                "保存エラー：" + error.message;
        } finally {
            saveButton.disabled = !latestMagneticData;
        }
    }

    // センサー開始ボタン
    startButton.addEventListener("click", async () => {
        if (listening) return;

        if (!window.isSecureContext) {
            status.textContent =
                "HTTPS接続が必要です。";
            return;
        }

        let started = false;
        const errors = [];

        // 方位・傾きセンサー
        if ("DeviceOrientationEvent" in window) {
            try {
                if (
                    typeof DeviceOrientationEvent.requestPermission
                    === "function"
                ) {
                    const permission =
                        await DeviceOrientationEvent.requestPermission();

                    if (permission !== "granted") {
                        throw new Error(
                            "方位センサーの利用が許可されませんでした。"
                        );
                    }
                }

                window.addEventListener(
                    "deviceorientation",
                    handleOrientation
                );

                started = true;

            } catch (error) {
                errors.push("方位センサー：" + error.message);
            }
        } else {
            errors.push(
                "このブラウザーは方位センサーに未対応です。"
            );
        }

        // 磁気センサー
        if ("Magnetometer" in window) {
            try {
                magnetometer = new Magnetometer({
                    frequency: 10
                });

                magnetometer.addEventListener(
                    "reading",
                    handleMagneticReading
                );

                magnetometer.addEventListener("error", (event) => {
                    status.textContent =
                        "磁気センサーエラー：" +
                        (event.error?.message ||
                         "センサーを利用できません。");
                });

                magnetometer.start();
                started = true;

            } catch (error) {
                errors.push("磁気センサー：" + error.message);
            }
        } else {
            errors.push(
                "このブラウザーは磁気データX・Y・Zの取得に未対応です。"
            );
        }

        if (started) {
            listening = true;
            startButton.disabled = true;

            status.textContent = errors.length
                ? "一部のセンサーを開始しました。" +
                  errors.join(" ")
                : "センサーのデータを待っています。";
        } else {
            status.textContent = errors.join(" ");
        }
    });

    // 保存ボタン
    saveButton.addEventListener("click", saveMagneticData);
</script>
</body>
</html>
