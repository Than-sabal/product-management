<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>iPhone方位センサーテスト</title>
</head>
<body>
    <h2>iPhone方位センサーテスト</h2>
    <p>ボタンを押してセンサーの利用を許可してください。</p>

    <button id="startButton">センサーを開始</button>
    <p id="status">待機中</p>

    <h3>方位：<span id="heading">--</span>°</h3>
    <p>α：<span id="alpha">--</span></p>
    <p>β：<span id="beta">--</span></p>
    <p>γ：<span id="gamma">--</span></p>

    <script>
        const status = document.getElementById("status");
        const startButton = document.getElementById("startButton");

        let listening = false;

        // 画面にセンサー値を表示
        function showValue(id, value) {
            document.getElementById(id).textContent =
                value == null ? "取得不可" :
                Number.isFinite(value) ? value.toFixed(1) :
                "取得不可";
        }

        // センサー情報を受信する
        function handleOrientation(event) {
            showValue("alpha", event.alpha);
            showValue("beta", event.beta);
            showValue("gamma", event.gamma);

            // iOS Safariで利用できる場合のコンパス方位
            const heading = event.webkitCompassHeading;

            if (Number.isFinite(heading)) {
                showValue("heading", heading);
            } else if (Number.isFinite(event.alpha)) {
                // alphaはコンパス方位とは別の値
                document.getElementById("heading").textContent =
                    "未対応";
            } else {
                document.getElementById("heading").textContent =
                    "取得不可";
            }

            // センサー値の取得状況を表示
            if (
                event.alpha == null &&
                event.beta == null &&
                event.gamma == null
            ) {
                status.textContent =
                    "イベント受信中ですが、センサー値は取得できません";
            } else {
                status.textContent =
                    "センサー値を取得しました";
            }

            // Flask APIへ向き情報を1秒に1回送信
            const now = Date.now();

            if (
                !handleOrientation.lastSent ||
                now - handleOrientation.lastSent >= 1000
            ) {
                handleOrientation.lastSent = now;

                fetch("/api/orientation", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        alpha: event.alpha,
                        beta: event.beta,
                        gamma: event.gamma,
                        heading: Number.isFinite(heading)
                            ? heading
                            : null
                    })
                })
                .then(async response => {
                    const result = await response.json();

                    if (!response.ok || !result.success) {
                        throw new Error(
                            result.message || "送信に失敗しました"
                        );
                    }

                    status.textContent =
                        "センサー取得・データベース保存成功";
                })
                .catch(error => {
                    status.textContent =
                        "送信エラー：" + error.message;
                });
            }
        }

        // センサー開始ボタン
        startButton.addEventListener("click", async () => {
            if (listening) return;

            // HTTPS接続を確認
            if (!window.isSecureContext) {
                status.textContent =
                    "HTTPS接続が必要です。";
                return;
            }

            // センサー対応状況を確認
            if (!("DeviceOrientationEvent" in window)) {
                status.textContent =
                    "このブラウザーは方位センサーに対応していません。";
                return;
            }

            try {
                // iPhone Safariでは許可が必要な場合がある
                if (
                    typeof DeviceOrientationEvent.requestPermission
                    === "function"
                ) {
                    const permission =
                        await DeviceOrientationEvent.requestPermission();

                    if (permission !== "granted") {
                        status.textContent =
                            "センサーの利用が許可されませんでした。";
                        return;
                    }
                }

                // センサー情報の受信を開始
                window.addEventListener(
                    "deviceorientation",
                    handleOrientation
                );

                listening = true;
                startButton.disabled = true;

                status.textContent =
                    "センサーのデータを待っています。";

            } catch (error) {
                status.textContent =
                    "エラー：" + error.message;
            }
        });
    </script>
</body>
</html>
