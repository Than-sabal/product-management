<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}回収員システム{% endblock %}</title>
<!-- Bootstrap CSS & Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
<style>

        body {

            background-color: #f4f6f9;

        }
</style>
</head>
<body>
<!--(Hamburger Menu)-->
<nav class="navbar navbar-dark bg-dark px-3 shadow-sm mb-4">
<div class="container-fluid">

<button class="btn btn-dark text-white border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuOffcanvas">
<i class="bi bi-list fs-3"></i>
</button>
<span class="navbar-brand mb-0 h1 fw-bold">
<i class="bi bi-truck text-warning me-2"></i> 回収員システム
</span>
<div>
<a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm rounded-pill">
<i class="bi bi-box-arrow-right me-1"></i> ログアウト
</a>
</div>
</div>
</nav>
<!-- Offcanvas Menu -->
<div class="offcanvas offcanvas-start bg-dark text-white" tabindex="-1" id="menuOffcanvas">
<div class="offcanvas-header border-bottom border-secondary">
<h5 class="offcanvas-title fw-bold">
<i class="bi bi-menu-app me-2 text-warning"></i> メニュー
</h5>
<button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
</div>
<div class="offcanvas-body">
<ul class="nav flex-column gap-2">
<li class="nav-item">
<a href="{{ url_for('collection_view') }}" class="nav-link text-white py-2 px-3 rounded hover-bg">
<i class="bi bi-house-door me-2 text-primary"></i> ダッシュボード
</a>
</li>
<!-- 📌検知履歴を確認する  -->
<li class="nav-item">
<a href="{{ url_for('collection_history') }}" class="nav-link text-white py-2 px-3 rounded">
<i class="bi bi-clock-history me-2 text-warning"></i> 検知履歴を確認する
</a>
</li>
</ul>
</div>
</div>
<!-- 🖥️ Main Content -->
<div class="container" style="max-width: 1000px;">

    {% block content %}{% endblock %}
</div>
<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
