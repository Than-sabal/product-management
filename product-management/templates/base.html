<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}危険物検知ナビ{% endblock %}</title>
<!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<!-- Top Header Bar -->
<div class="bg-success text-white py-2 px-4 d-flex justify-content-between align-items-center">
<h4 class="m-0 fw-bold">♻️ ごみ分別ナビ</h4>
<div>
<span class="me-3">山田 太郎 さん (〇〇市)</span>
<a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm rounded-pill">ログアウト</a>
</div>
</div>
<div class="container-fluid">
<div class="row">
<!--Sidebar Menu -->
<div class="col-md-3 col-lg-2 bg-dark text-white p-3 min-vh-100">
<p class="text-secondary small fw-bold mb-3 px-2">【自治体職員 機能】</p>
<div class="nav flex-column nav-pills">
<!-- 1. 検知情報を確認する -->
<a href="{{ url_for('alerts') }}" class="nav-link text-white mb-2 fs-6 hover-bg">
  🔍 検知情報を確認する
</a>
<!-- 2. 検知履歴を確認する -->
<a href="{{ url_for('history') }}" class="nav-link text-white mb-2 fs-6 hover-bg">
  📜 検知履歴を確認する
</a>
<!-- 3. 回収員へ報告する -->
<a href="{{ url_for('report') }}" class="nav-link text-white mb-2 fs-6 hover-bg">
  📢 回収員へ報告する
</a>
<hr class="text-secondary my-3">
<!-- 4. ログアウト -->
<a href="{{ url_for('logout') }}" class="nav-link text-warning mb-2 fs-6 hover-bg">
  🔑 ログアウト
</a>
</div>
</div>
<!-- Main Content Area -->
<div class="col-md-9 col-lg-10 p-4 bg-light">
  {% block content %}
  {% endblock %}
</div>
</div>
</div>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
