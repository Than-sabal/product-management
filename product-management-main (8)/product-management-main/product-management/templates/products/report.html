{% extends "base.html" %}
{% block title %}
検知情報確認 | ごみ分別ナビ
{% endblock %}
{% block content %}
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>回収員へ報告</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
<div class="container">
<h2>📤 回収員への報告フォーム</h2>
<div class="card p-4 shadow-sm bg-white">
<form>
<div class="mb-3">
<label class="form-label">報告先 回収班</label>
<select class="form-select"><option>A班 (東エリア)</option><option>B班 (西エリア)</option></select>
</div>
<div class="mb-3">
<label class="form-label">連絡内容・指示</label>
<textarea class="form-control" rows="3" placeholder="回収をお願いします。"></textarea>
</div>
<button type="submit" class="btn btn-success">報告を送信する</button>
</form>
</div>
<br>
<a href="{{ url_for('products') }}" class="btn btn-secondary">← トップへ戻る</a>
</div>
</body>
</html>
{% endblock %}
