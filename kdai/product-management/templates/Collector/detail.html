{% extends "base.html" %}

{% block title %}検知写真・詳細確認{% endblock %}

{% block content %}
<div class="container mt-4" style="max-width: 600px;">
<div class="card shadow-sm border-0 rounded-4">
<div class="card-header bg-primary text-white p-3 rounded-top-4">
<h4 class="mb-0 fw-bold">📷 検知写真 ＆ 詳細情報</h4>
</div>
<div class="card-body p-4 text-center">
<!-- 検知写真の表示 -->
<div class="mb-3 bg-light p-3 rounded-3">
<img src="https://via.placeholder.com/400x250?text=Hazardous+Item+Photo" class="img-fluid rounded shadow-sm" alt="検知写真">
</div>
<table class="table table-bordered text-start mb-4">
<tr><th>対象物</th><td><span class="badge bg-danger">スプレー缶</span></td></tr>
<tr><th>場所</th><td>第1作業区</td></tr>
<tr><th>検知日時</th><td>2026/10/21 10:15</td></tr>
<tr><th>備考</th><td>ベルトコンベア付近で危険物を検知しました。</td></tr>
</table>
<div class="d-flex justify-content-between">
<a href="{{ url_for('collection_page') }}" class="btn btn-outline-secondary rounded-pill px-4">

                    戻る
</a>
<a href="{{ url_for('collection_report_form') }}" class="btn btn-success rounded-pill px-4">

                    回収完了報告へ進む ➔
</a>
</div>
</div>
</div>
</div>

{% endblock %}
