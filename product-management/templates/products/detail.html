{% extends "base.html" %}

{% block title %}
商品詳細
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <h2>商品詳細</h2>

    <div>

        <a
            href="{{ url_for('product_edit', product_id=product_id) }}"
            class="btn btn-warning"
        >
            編集
        </a>

        <a
            href="{{ url_for('product_delete', product_id=product_id) }}"
            class="btn btn-danger"
        >
            削除
        </a>

    </div>

</div>


<div class="card shadow-sm">

    <div class="card-body">

        <dl class="row">

            <dt class="col-sm-3">
                商品ID
            </dt>

            <dd class="col-sm-9">
                {{ product_id }}
            </dd>


            <dt class="col-sm-3">
                商品名
            </dt>

            <dd class="col-sm-9">
                商品A
            </dd>


            <dt class="col-sm-3">
                カテゴリ
            </dt>

            <dd class="col-sm-9">
                食品
            </dd>


            <dt class="col-sm-3">
                価格
            </dt>

            <dd class="col-sm-9">
                1,000円
            </dd>


            <dt class="col-sm-3">
                在庫数
            </dt>

            <dd class="col-sm-9">
                50
            </dd>


            <dt class="col-sm-3">
                商品説明
            </dt>

            <dd class="col-sm-9">
                商品の説明がここに入ります。
            </dd>

        </dl>


        <a
            href="{{ url_for('products') }}"
            class="btn btn-secondary"
        >
            商品一覧へ戻る
        </a>

    </div>

</div>

{% endblock %}
