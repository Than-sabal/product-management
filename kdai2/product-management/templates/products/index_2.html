{% extends "base.html" %}
{% block title %}トップページ | Pattern 2{% endblock %}
{% block content %}
<div class="container py-4">
<!-- Hero Banner -->
<div class="p-4 p-md-5 mb-4 rounded-4 bg-success text-white shadow-sm position-relative overflow-hidden">
<div class="col-md-8 position-relative z-1">
<h1 class="display-6 fw-bold mb-2">ごみ分別ナビ ダッシュボード</h1>
<p class="fs-6 opacity-90 mb-4">AIセンサーによる自動検知と安全な廃棄管理システムへようこそ。</p>
<a href="#monitoring" class="btn btn-light text-success fw-bold px-4 py-2 rounded-pill">
               モニタリングを開始
</a>
</div>
</div>
<!-- Monitoring Section -->
<div id="monitoring" class="row justify-content-center">
<div class="col-lg-10">
<div id="normal-state" class="card border-0 shadow-sm rounded-4 overflow-hidden">
<div class="card-header bg-dark text-white py-3 text-center">
<h5 class="fw-bold mb-0">📡 投入口 リアルタイムステータス</h5>
</div>
<div class="card-body p-5 text-center bg-white">
<span class="badge bg-success-subtle text-success fs-5 px-4 py-2 rounded-pill mb-3">
                       🟢 正常稼働中
</span>
<h2 class="fw-bold text-dark mt-2">危険物は確認されていません</h2>
<p class="text-muted">ごみを投入口へ入れてください。</p>
<div class="mt-4">
<button type="button" class="btn btn-sm btn-outline-danger" onclick="showWarning()">
                           ⚠️ 検知シミュレーション
</button>
</div>
</div>
</div>
<div id="warning-state" class="card border-danger shadow-lg rounded-4 overflow-hidden d-none">
<div class="card-header bg-danger text-white py-3 text-center">
<h4 class="fw-bold mb-0">🚨 警告: 危険物検知</h4>
</div>
<div class="card-body p-5 text-center bg-white">
<h3 class="fw-bold text-danger mb-3">危険物・金属が含まれています</h3>
<p class="text-muted">カメラ撮影および検知ログの保存が完了しました。</p>
<button type="button" class="btn btn-secondary mt-3" onclick="showNormal()">
                       🔄 通常状態に戻す
</button>
</div>
</div>
</div>
</div>
</div>
<script>
   function showWarning() {
       document.getElementById('normal-state').classList.add('d-none');
       document.getElementById('warning-state').classList.remove('d-none');
   }
   function showNormal() {
       document.getElementById('warning-state').classList.add('d-none');
       document.getElementById('normal-state').classList.remove('d-none');
   }
</script>
{% endblock %}
