
{% extends "base.html" %}

{% block title %}全国マップ | ごみ分別ナビ{% endblock %}

{% block content %}

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
.map-container {
    padding: 20px;
    max-width: 1500px;
    margin: auto;
}

.map-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 15px;
}

.map-header h2 {
    font-weight: 700;
    margin: 0;
}

#map {
    width: 100%;
    height: 75vh;
    min-height: 500px;
    border-radius: 16px;
    border: 1px solid #ddd;
    z-index: 1;
}

.map-controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.map-btn {
    border: none;
    border-radius: 9px;
    padding: 10px 15px;
    background: #198754;
    color: white;
    font-weight: 600;
    cursor: pointer;
}

.map-btn:hover {
    opacity: .85;
}

.map-btn:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.map-search {
    display: flex;
    align-items: center;
    gap: 6px;
}

.map-search input {
    width: 210px;
    max-width: 42vw;
    padding: 10px 12px;
    border: 1px solid #ced4da;
    border-radius: 9px;
    font-size: 14px;
}

.map-search button {
    white-space: nowrap;
}

.map-search-status {
    width: 100%;
    font-size: 13px;
    color: #6c757d;
    margin-top: 4px;
}

@media(max-width: 600px) {
    .map-search {
        width: 100%;
    }

    .map-search input {
        flex: 1 1 100%;
        width: auto;
        max-width: none;
        min-width: 0;
    }
}

.detection-pin {
    position: relative;
    width: 30px;
    height: 40px;
}

.detection-pin .pin-head {
    position: absolute;
    top: 0;
    left: 3px;
    width: 24px;
    height: 24px;
    background: #ec168c;
    border: 2px solid white;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    box-shadow: 0 2px 5px rgba(0,0,0,.35);
}

.detection-pin .pin-head::after {
    content: "";
    position: absolute;
    width: 8px;
    height: 8px;
    top: 6px;
    left: 6px;
    background: white;
    border-radius: 50%;
}

.detection-pin.nearby .pin-head {
    background: #ec168c;
    animation: none;
    box-shadow: 0 2px 5px rgba(0,0,0,.35);
}

.proximity-alert {
    display: none !important;
}

.gps-status {
    margin-top: 12px;
    padding: 12px;
    border-radius: 10px;
    background: #f1f7ff;
    border: 1px solid #cfe2ff;
    font-size: 14px;
}

.map-popup {
    min-width: 220px;
    max-width: 270px;
}

.map-popup-title {
    font-size: 16px;
    font-weight: bold;
    color: #d41478;
    margin-bottom: 8px;
}

.map-popup-photo {
    width: 100%;
    max-height: 140px;
    object-fit: contain;
    background: #f1f1f1;
    border-radius: 7px;
    margin-bottom: 8px;
}

.map-popup-info {
    font-size: 13px;
    line-height: 1.8;
}

.map-detail-btn {
    display: block;
    text-align: center;
    background: #198754;
    color: white !important;
    padding: 8px;
    border-radius: 20px;
    text-decoration: none;
    margin-top: 10px;
    font-weight: bold;
}

.map-detail-btn:hover {
    background: #146c43;
}

.map-info {
    margin-top: 15px;
    padding: 14px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 12px;
}

.map-legend {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    font-size: 14px;
    margin-top: 10px;
}

.legend-dot {
    display: inline-block;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    margin-right: 5px;
}

@media(max-width: 600px) {
    #map {
        height: 65vh;
        min-height: 400px;
    }

    .map-btn {
        padding: 9px 11px;
        font-size: 13px;
    }
}
</style>

<div class="map-container">

    <div class="map-header">
        <h2>🗾 ごみ分別ナビ 全国マップ</h2>

        <div class="map-controls">
            <div class="map-search">

                <input type="text"
                       id="mapSearchInput"
                       placeholder="地域・住所（例：札幌市）"
                       aria-label="地名・住所検索">

                <input type="text"
                       id="itemSearchInput"
                       placeholder="危険物名（例：ライター）"
                       aria-label="危険物名検索">

                <button class="map-btn"
                        id="mapSearchButton"
                        onclick="searchMapLocation()">
                    🔍 検索
                </button>

                <button class="map-btn"
                        id="showAllDetectionsButton"
                        onclick="showAllDetections()"
                        style="background:#6c757d;">
                    全件表示
                </button>

            </div>

            <button class="map-btn"
                    onclick="changeMap('normal')">
                標準マップ
            </button>

            <button class="map-btn"
                    onclick="changeMap('satellite')">
                航空写真
            </button>

            <button class="map-btn"
                    id="gpsButton"
                    onclick="showCurrentLocation()">
                📍 GPS開始
            </button>

            <button class="map-btn"
                    id="gpsStopButton"
                    onclick="stopGPS()"
                    style="display:none;background:#6c757d;">
                GPS停止
            </button>

        </div>

        <div id="mapSearchStatus"
             class="map-search-status"
             role="status"></div>
    </div>

    <div id="map"></div>

    <div class="gps-status">
        <div id="gpsStatus">
            📍 GPSは停止中です。「GPS開始」を押してください。
        </div>
        <div id="gpsDistance" class="mt-1 text-muted"></div>
    </div>

    <div class="map-info">
        <strong>📌 検知場所の状態</strong>

        <div class="map-legend">
            <span>
                <i class="legend-dot" style="background:#dc3545"></i>
                未対応
            </span>

            <span>
                <i class="legend-dot" style="background:#ffc107"></i>
                回収依頼中
            </span>

            <span>
                <i class="legend-dot" style="background:#198754"></i>
                回収済み
            </span>
        </div>

        <p class="text-muted mt-2 mb-0">
            地名・住所または危険物名を検索すると、
            条件に一致する検知情報だけを表示します。
            「全件表示」で検索を解除できます。
        </p>
    </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// =====================================
// Flaskから検知データを取得
// =====================================

const detectionData = {{ detections | tojson | safe }};

const uploadBaseUrl =
    {{ url_for('static', filename='uploads/') | tojson }};

const detailBaseUrl =
    {{ url_for('collection_detail') | tojson }};


// =====================================
// 地図初期設定
// =====================================

const map = L.map('map').setView(
    [36.2048, 138.2529],
    5
);

const normalLayer = L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
    }
);

const satelliteLayer = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {
        maxZoom: 19,
        attribution: 'Tiles &copy; Esri'
    }
);

normalLayer.addTo(map);

function changeMap(type) {

    if (map.hasLayer(normalLayer)) {
        map.removeLayer(normalLayer);
    }

    if (map.hasLayer(satelliteLayer)) {
        map.removeLayer(satelliteLayer);
    }

    if (type === 'satellite') {
        satelliteLayer.addTo(map);
    } else {
        normalLayer.addTo(map);
    }
}


// =====================================
// 共通変数
// =====================================

let mapSearchMarker = null;
let mapSearchRequesting = false;

const markerBounds = [];
const detectionMarkers = [];


// =====================================
// HTMLエスケープ
// =====================================

function escapeHTML(value) {

    return String(value ?? '').replace(
        /[&<>"']/g,
        char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        })[char]
    );

}


// =====================================
// 状態による色
// =====================================

function getMarkerColor(status) {

    if (
        status === '回収済み' ||
        status === '対応済み'
    ) {
        return '#198754';
    }

    if (status === '回収依頼中') {
        return '#ffc107';
    }

    return '#dc3545';
}


// =====================================
// ピンアイコン
// =====================================

const pinkPinIcon = L.divIcon({

    className: '',

    html: `
        <div class="detection-pin">
            <div class="pin-head"></div>
        </div>
    `,

    iconSize: [30, 40],
    iconAnchor: [15, 40],
    popupAnchor: [0, -38]

});


// =====================================
// 検知位置を地図に表示
// =====================================

if (!Array.isArray(detectionData)) {

    console.error(
        '検知データが配列ではありません。',
        detectionData
    );

} else {

    detectionData.forEach(item => {

        if (
            item.latitude == null ||
            item.longitude == null
        ) {
            return;
        }

        const lat = Number(item.latitude);
        const lng = Number(item.longitude);

        if (
            !Number.isFinite(lat) ||
            !Number.isFinite(lng) ||
            lat < -90 || lat > 90 ||
            lng < -180 || lng > 180
        ) {
            return;
        }

        const status = item.status || '未対応';

        const marker = L.marker(
            [lat, lng],
            { icon: pinkPinIcon }
        ).addTo(map);

        markerBounds.push([lat, lng]);

        // 写真表示
        let photoHtml = '';

        if (item.photo) {

            const photoUrl =
                uploadBaseUrl +
                encodeURIComponent(item.photo);

            photoHtml = `
                <img
                    src="${escapeHTML(photoUrl)}"
                    class="map-popup-photo"
                    alt="検知写真"
                    onerror="this.style.display='none';"
                >
            `;

        }

        // 詳細画面リンク
        let detailHtml = '';

        if (item.request_id) {

            const detailUrl =
                detailBaseUrl +
                '?request_id=' +
                encodeURIComponent(item.request_id);

            detailHtml = `
                <a class="map-detail-btn"
                   href="${escapeHTML(detailUrl)}">
                    詳細を見る ➜
                </a>
            `;

        }

        const popupContent = `
            <div class="map-popup">

                <div class="map-popup-title">
                    📍 ${escapeHTML(item.item_name)}
                </div>

                ${photoHtml}

                <div class="map-popup-info">

                    <strong>場所：</strong>
                    ${escapeHTML(item.location)}<br>

                    <strong>状態：</strong>

                    <span style="
                        color:${getMarkerColor(status)};
                        font-weight:bold;
                    ">
                        ${escapeHTML(status)}
                    </span><br>

                    <strong>検知日時：</strong>
                    ${escapeHTML(item.detected_at)}<br>

                    <strong>備考：</strong>
                    ${escapeHTML(item.message || 'なし')}

                </div>

                ${detailHtml}

            </div>
        `;

        marker.bindPopup(popupContent);

        detectionMarkers.push({

            id: String(item.id),
            name: item.item_name || '',
            location: item.location || '',
            marker: marker,
            rangeCircle: null,
            position: L.latLng(lat, lng)

        });

    });

}


// =====================================
// 検索処理
// =====================================

async function searchMapLocation() {

    const input =
        document.getElementById('mapSearchInput');

    const itemInput =
        document.getElementById('itemSearchInput');

    const status =
        document.getElementById('mapSearchStatus');

    const button =
        document.getElementById('mapSearchButton');

    const keyword = input.value.trim();
    const itemKeyword = itemInput.value.trim();

    if (!keyword && !itemKeyword) {

        status.textContent =
            '地域・住所または危険物名を入力してください。';

        input.focus();
        return;
    }

    if (mapSearchRequesting) {
        return;
    }

    // 地域が空欄の場合は危険物名だけで検索
    if (!keyword) {

        if (mapSearchMarker) {
            map.removeLayer(mapSearchMarker);
            mapSearchMarker = null;
        }

        const matchedCount =
            applyCombinedDetectionFilter(
                null,
                itemKeyword
            );

        status.textContent =
            '危険物名：「' +
            itemKeyword +
            '」｜該当する検知情報：' +
            matchedCount +
            '件';

        return;
    }

    mapSearchRequesting = true;
    button.disabled = true;

    status.textContent =
        '地域と危険物名を検索しています...';

    try {

        const url =
            'https://nominatim.openstreetmap.org/search' +
            '?format=jsonv2&limit=5&countrycodes=jp&accept-language=ja&q=' +
            encodeURIComponent(keyword);

        const response = await fetch(url, {
            headers: {
                'Accept': 'application/json'
            }
        });

        if (!response.ok) {
            throw new Error(
                '検索サービスから正常な応答がありません。'
            );
        }

        const results = await response.json();

        if (!results.length) {

            status.textContent =
                '場所が見つかりませんでした。別の地名で検索してください。';

            return;
        }

        const result = results[0];

        const lat = Number(result.lat);
        const lng = Number(result.lon);

        if (
            !Number.isFinite(lat) ||
            !Number.isFinite(lng)
        ) {
            throw new Error(
                '位置情報を読み取れませんでした。'
            );
        }

        if (mapSearchMarker) {
            map.removeLayer(mapSearchMarker);
        }

        mapSearchMarker = L.marker(
            [lat, lng]
        )
        .addTo(map)
        .bindPopup(
            '<strong>検索場所</strong><br>' +
            escapeHTML(result.display_name)
        )
        .openPopup();

        const matchedCount =
            applyCombinedDetectionFilter(
                result,
                itemKeyword
            );

        const areaText =
            '地域：' + result.display_name;

        const itemText = itemKeyword
            ? '｜危険物名：「' + itemKeyword + '」'
            : '';

        status.textContent =
            areaText +
            itemText +
            '｜該当する検知情報：' +
            matchedCount +
            '件';

    } catch (error) {

        console.error(
            '地図検索エラー:',
            error
        );

        status.textContent =
            '検索に失敗しました。通信環境を確認して、もう一度お試しください。';

    } finally {

        mapSearchRequesting = false;
        button.disabled = false;

    }

}


// =====================================
// 地域＋危険物名でピンを絞り込む
// =====================================

function applyCombinedDetectionFilter(
    result,
    itemKeyword
) {

    let searchBounds = null;

    if (result) {

        if (
            Array.isArray(result.boundingbox) &&
            result.boundingbox.length === 4
        ) {

            const south =
                Number(result.boundingbox[0]);

            const north =
                Number(result.boundingbox[1]);

            const west =
                Number(result.boundingbox[2]);

            const east =
                Number(result.boundingbox[3]);

            if (
                [south, north, west, east]
                    .every(Number.isFinite)
            ) {

                searchBounds = L.latLngBounds(
                    [south, west],
                    [north, east]
                );

            }

        }

        if (!searchBounds) {

            searchBounds = L.circle(
                [
                    Number(result.lat),
                    Number(result.lon)
                ],
                {
                    radius: 5000
                }
            ).getBounds();

        }

    }

    const normalizedKeyword =
        String(itemKeyword || '')
            .trim()
            .toLocaleLowerCase();

    let visibleCount = 0;
    const visiblePositions = [];

    detectionMarkers.forEach(item => {

        const isInArea =
            !searchBounds ||
            searchBounds.contains(item.position);

        const isMatchingName =
            !normalizedKeyword ||
            String(item.name)
                .toLocaleLowerCase()
                .includes(normalizedKeyword);

        const shouldShow =
            isInArea && isMatchingName;

        if (shouldShow) {

            if (!map.hasLayer(item.marker)) {
                item.marker.addTo(map);
            }

            visibleCount++;
            visiblePositions.push(item.position);

        } else {

            // 条件に一致しないピンを地図から削除
            if (map.hasLayer(item.marker)) {
                map.removeLayer(item.marker);
            }

        }

        // 検索中は範囲円を表示しない
        if (
            item.rangeCircle &&
            map.hasLayer(item.rangeCircle)
        ) {
            map.removeLayer(item.rangeCircle);
        }

    });

    // 地域検索の場合
    if (searchBounds) {

        map.fitBounds(
            searchBounds,
            {
                padding: [35, 35],
                maxZoom: 14
            }
        );

    } else if (visiblePositions.length > 0) {

        // 危険物名だけの場合
        map.fitBounds(
            L.latLngBounds(visiblePositions),
            {
                padding: [40, 40],
                maxZoom: 14
            }
        );

    }

    return visibleCount;

}


// =====================================
// 全件表示・検索解除
// =====================================

function showAllDetections() {

    // すべての検知ピンを復元
    detectionMarkers.forEach(item => {

        if (!map.hasLayer(item.marker)) {
            item.marker.addTo(map);
        }

        if (
            item.rangeCircle &&
            !map.hasLayer(item.rangeCircle)
        ) {
            item.rangeCircle.addTo(map);
        }

    });

    // 地域検索マーカーを削除
    if (mapSearchMarker) {

        map.removeLayer(mapSearchMarker);
        mapSearchMarker = null;

    }

    // 入力欄を空にする
    document.getElementById(
        'mapSearchInput'
    ).value = '';

    document.getElementById(
        'itemSearchInput'
    ).value = '';

    document.getElementById(
        'mapSearchStatus'
    ).textContent =
        '検索を解除しました。すべての検知情報を表示しています。';

    // 全件表示の範囲に戻す
    if (markerBounds.length > 0) {

        map.fitBounds(
            markerBounds,
            {
                padding: [40, 40],
                maxZoom: 12
            }
        );

    } else {

        map.setView(
            [36.2048, 138.2529],
            5
        );

    }

}


// =====================================
// Enterキーで検索
// =====================================

document.getElementById(
    'mapSearchInput'
).addEventListener(
    'keydown',
    function(event) {

        if (event.key === 'Enter') {
            searchMapLocation();
        }

    }
);

document.getElementById(
    'itemSearchInput'
).addEventListener(
    'keydown',
    function(event) {

        if (event.key === 'Enter') {
            searchMapLocation();
        }

    }
);


// =====================================
// GPS設定
// =====================================

let currentMarker = null;
let accuracyCircle = null;
let watchId = null;
let currentPosition = null;


// =====================================
// GPS開始
// =====================================

function showCurrentLocation() {

    if (!navigator.geolocation) {

        alert(
            'このブラウザはGPSに対応していません。'
        );

        return;
    }

    if (watchId !== null) {
        return;
    }

    document.getElementById(
        'gpsStatus'
    ).textContent =
        '📡 パソコンの位置情報を取得しています...';

    watchId = navigator.geolocation.watchPosition(

        function(position) {

            const lat =
                position.coords.latitude;

            const lng =
                position.coords.longitude;

            const accuracy =
                position.coords.accuracy;

            currentPosition =
                L.latLng(lat, lng);

            // 現在地マーカー
            if (!currentMarker) {

                currentMarker = L.circleMarker(
                    [lat, lng],
                    {
                        radius: 9,
                        color: '#ffffff',
                        weight: 3,
                        fillColor: '#1677ff',
                        fillOpacity: 1
                    }
                ).addTo(map);

                currentMarker.bindPopup('📍 現在地');

                map.setView(
                    [lat, lng],
                    16
                );

            } else {

                currentMarker.setLatLng(
                    [lat, lng]
                );

            }

            // GPS精度の範囲
            if (!accuracyCircle) {

                accuracyCircle = L.circle(
                    [lat, lng],
                    {
                        radius: accuracy,
                        color: '#1677ff',
                        fillColor: '#1677ff',
                        fillOpacity: 0.08,
                        weight: 1
                    }
                ).addTo(map);

            } else {

                accuracyCircle.setLatLng(
                    [lat, lng]
                );

                accuracyCircle.setRadius(
                    accuracy
                );

            }

            document.getElementById(
                'gpsStatus'
            ).textContent =
                '🟢 GPS稼働中｜現在地を取得しています';

            document.getElementById(
                'gpsDistance'
            ).textContent =
                'GPS精度：約' +
                Math.round(accuracy) +
                'm';

            document.getElementById(
                'gpsButton'
            ).style.display = 'none';

            document.getElementById(
                'gpsStopButton'
            ).style.display = 'inline-block';

        },

        function(error) {

            let message =
                'GPSを取得できませんでした。';

            if (error.code === 1) {

                message =
                    '位置情報が許可されていません。WindowsとEdgeの位置情報の許可を確認してください。';

            } else if (error.code === 2) {

                message =
                    '現在地を取得できません。';

            } else if (error.code === 3) {

                message =
                    'GPSの取得がタイムアウトしました。';

            }

            document.getElementById(
                'gpsStatus'
            ).textContent =
                '🔴 ' + message;

        },

        {
            enableHighAccuracy: true,
            maximumAge: 3000,
            timeout: 20000
        }

    );

}


// =====================================
// GPS停止
// =====================================

function stopGPS() {

    if (watchId !== null) {

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId = null;

    }

    currentPosition = null;

    if (currentMarker) {

        map.removeLayer(currentMarker);
        currentMarker = null;

    }

    if (accuracyCircle) {

        map.removeLayer(accuracyCircle);
        accuracyCircle = null;

    }

    document.getElementById(
        'gpsStatus'
    ).textContent =
        '📍 GPSは停止中です。';

    document.getElementById(
        'gpsDistance'

}
