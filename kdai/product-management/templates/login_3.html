<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン | Pattern 3</title>
<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark-subtle d-flex align-items-center min-vh-100">
<div class="container py-5">
<div class="row justify-content-center">
<div class="col-md-5 col-lg-4">
<div class="card shadow-lg border-0 rounded-4 overflow-hidden">
<!-- Header Banner -->
<div class="card-header bg-dark text-white text-center py-4">
<div class="fs-1 mb-1">🔑</div>
<h5 class="fw-bold mb-0">自治体職員 ログイン</h5>
<p class="small text-secondary mb-0">ごみ分別・危険物検知管理システム</p>
</div>
<div class="card-body p-4 bg-white">
<div class="text-center mb-4">
<span class="badge bg-success-subtle text-success border border-success px-3 py-2 rounded-pill">
                           ● 危険物検知システム 2.0
</span>
</div>
<form action="{{ url_for('login') }}" method="POST">
<div class="mb-3 text-start">
<label class="form-label fw-bold text-dark small">職員ID</label>
<div class="input-group">
<span class="input-group-text bg-light text-muted">👤</span>
<input type="text" class="form-control bg-light" placeholder="admin123" required>
</div>
</div>
<div class="mb-4 text-start">
<label class="form-label fw-bold text-dark small">パスワード</label>
<div class="input-group">
<span class="input-group-text bg-light text-muted">🔒</span>
<input type="password" class="form-control bg-light" placeholder="••••••••" required>
</div>
</div>
<button type="submit" class="btn btn-success w-100 py-2 fw-bold rounded-pill shadow-sm">
                           システムへログイン
</button>
</form>
</div>
<div class="card-footer bg-light text-center py-3">
<small class="text-muted">© 2026 ごみ分別ナビ All Rights Reserved.</small>
</div>
</div>
</div>
</div>
</div>
</body>
</html>
