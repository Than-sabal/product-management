
{% extends "base.html" %}

{% block title %}全国マップ | ごみ分別ナビ{% endblock %}

{% block content %}

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
.map-container {
    padding: 20px;
    max-width: 1500px;
    margin: auto;
}

.map-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 15px;
}

.map-header h2 {
    font-weight: 700;
    margin: 0;
}

#map {
    width: 100%;
    height: 75vh;
    min-height: 500px;
    border-radius: 16px;
    border: 1px solid #ddd;
    z-index: 1;
}

.map-controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.map-btn {
    border: none;
    border-radius: 9px;
    padding: 10px 15px;
    background: #198754;
    color: white;
    font-weight: 600;
    cursor: pointer;
}

.map-btn:hover {
    opacity: .85;
}

/* ピンク色の地図ピン */
.detection-pin {
    position: relative;
    width: 30px;
    height: 40px;
}

.detection-pin .pin-head {
    position: absolute;
    top: 0;
    left: 3px;
    width: 24px;
    height: 24px;
    background: #ec168c;
    border: 2px solid white;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    box-shadow: 0 2px 5px rgba(0,0,0,.35);
}

.detection-pin .pin-head::after {
    content: "";
    position: absolute;
    width: 8px;
    height: 8px;
    top: 6px;
    left: 6px;
    background: white;
    border-radius: 50%;
}

.map-popup {
    min-width: 220px;
    max-width: 270px;
}

.map-popup-title {
    font-size: 16px;
    font-weight: bold;
    color: #d41478;
    margin-bottom: 8px;
}

.map-popup-photo {
    width: 100%;
    max-height: 140px;
    object-fit: contain;
    background: #f1f1f1;
    border-radius: 7px;
    margin-bottom: 8px;
}

.map-popup-info {
    font-size: 13px;
    line-height: 1.8;
}

.map-detail-btn {
    display: block;
    text-align: center;
    background: #198754;
    color: white !important;
    padding: 8px;
    border-radius: 20px;
    text-decoration: none;
    margin-top: 10px;
    font-weight: bold;
}

.map-detail-btn:hover {
    background: #146c43;
}

.map-info {
    margin-top: 15px;
    padding: 14px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 12px;
}

.map-legend {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    font-size: 14px;
    margin-top: 10px;
}

.legend-dot {
    display: inline-block;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    margin-right: 5px;
}

@media(max-width: 600px) {
    #map {
        height: 65vh;
        min-height: 400px;
    }
}
</style>

<div class="map-container">

    <div class="map-header">
        <h2>🗾 ごみ分別ナビ 全国マップ</h2>

        <div class="map-controls">
            <button class="map-btn" onclick="changeMap('normal')">
                標準マップ
            </button>

            <button class="map-btn" onclick="changeMap('satellite')">
                航空写真
            </button>

            <button class="map-btn" onclick="showCurrentLocation()">
                📍 現在地
            </button>
        </div>
    </div>

    <div id="map"></div>

    <div class="map-info">
        <strong>📌 検知場所の状態</strong>

        <div class="map-legend">
            <span><i class="legend-dot" style="background:#dc3545"></i>未対応</span>
            <span><i class="legend-dot" style="background:#ffc107"></i>回収依頼中</span>
            <span><i class="legend-dot" style="background:#198754"></i>回収済み</span>
        </div>

        <p class="text-muted mt-2 mb-0">
            ピンク色のピンを押すと、検知情報と写真を確認できます。
        </p>
    </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // 日本全国を初期表示
    const map = L.map('map').setView([36.2048, 138.2529], 5);

    const normalLayer = L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }
    );

    const satelliteLayer = L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri'
        }
    );

    normalLayer.addTo(map);

    function changeMap(type) {
        if (map.hasLayer(normalLayer)) {
            map.removeLayer(normalLayer);
        }

        if (map.hasLayer(satelliteLayer)) {
            map.removeLayer(satelliteLayer);
        }

        if (type === 'satellite') {
            satelliteLayer.addTo(map);
        } else {
            normalLayer.addTo(map);
        }
    }

    // 現在地表示
    let currentMarker = null;

    function showCurrentLocation() {
        if (!navigator.geolocation) {
            alert('このブラウザはGPSに対応していません。');
            return;
        }

        navigator.geolocation.getCurrentPosition(
            function(position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;

                map.setView([lat, lng], 16);

                if (currentMarker) {
                    map.removeLayer(currentMarker);
                }

                currentMarker = L.circleMarker(
                    [lat, lng],
                    {
                        radius: 9,
                        color: '#ffffff',
                        weight: 3,
                        fillColor: '#1677ff',
                        fillOpacity: 1
                    }
                ).addTo(map);

                currentMarker.bindPopup('📍 現在地').openPopup();
            },
            function() {
                alert('現在地を取得できませんでした。位置情報の許可を確認してください。');
            },
            {
                enableHighAccuracy: true,
                timeout: 10000
            }
        );
    }

    // Flaskから検知データを取得
    const detectionData = {{ detections | tojson }};

    const uploadBaseUrl = {{ url_for('static', filename='uploads/') | tojson }};
    const detailBaseUrl = {{ url_for('collection_detail') | tojson }};

    function escapeHTML(value) {
        return String(value ?? '').replace(/[&<>"']/g, char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        })[char]);
    }

    function getMarkerColor(status) {
        if (status === '回収済み' || status === '対応済み') {
            return '#198754';
        }

        if (status === '回収依頼中') {
            return '#ffc107';
        }

        return '#dc3545';
    }

    // ピンク色のピンアイコン
    const pinkPinIcon = L.divIcon({
        className: '',
        html: `
            <div class="detection-pin">
                <div class="pin-head"></div>
            </div>
        `,
        iconSize: [30, 40],
        iconAnchor: [15, 40],
        popupAnchor: [0, -38]
    });

    const markerBounds = [];

    // 検知位置を地図に表示
    detectionData.forEach(item => {

        if (item.latitude == null || item.longitude == null) {
            return;
        }

        const lat = Number(item.latitude);
        const lng = Number(item.longitude);

        if (
            !Number.isFinite(lat) ||
            !Number.isFinite(lng) ||
            lat < -90 || lat > 90 ||
            lng < -180 || lng > 180
        ) {
            return;
        }

        const status = item.status || '未対応';

        const marker = L.marker(
            [lat, lng],
            { icon: pinkPinIcon }
        ).addTo(map);

        markerBounds.push([lat, lng]);

        // 写真
        let photoHtml = '';

        if (item.photo) {
            const photoUrl = uploadBaseUrl +
                encodeURIComponent(item.photo);

            photoHtml = `
                <img
                    src="${escapeHTML(photoUrl)}"
                    class="map-popup-photo"
                    alt="検知写真"
                    onerror="this.style.display='none';"
                >
            `;
        }

        // 詳細画面へのリンク
        let detailHtml = '';

        if (item.request_id) {
            const detailUrl = detailBaseUrl +
                '?request_id=' +
                encodeURIComponent(item.request_id);

            detailHtml = `
                <a class="map-detail-btn"
                   href="${escapeHTML(detailUrl)}">
                    詳細を見る ➜
                </a>
            `;
        }

        const popupContent = `
            <div class="map-popup">

                <div class="map-popup-title">
                    📍 ${escapeHTML(item.item_name)}
                </div>

                ${photoHtml}

                <div class="map-popup-info">
                    <strong>場所：</strong>
                    ${escapeHTML(item.location)}<br>

                    <strong>状態：</strong>
                    <span style="color:${getMarkerColor(status)};font-weight:bold;">
                        ${escapeHTML(status)}
                    </span><br>

                    <strong>検知日時：</strong>
                    ${escapeHTML(item.detected_at)}<br>

                    <strong>備考：</strong>
                    ${escapeHTML(item.message || 'なし')}
                </div>

                ${detailHtml}

            </div>
        `;

        marker.bindPopup(popupContent);
    });

    // 検知場所がある場合、ピンが見える範囲に調整
    if (markerBounds.length > 0) {
        map.fitBounds(markerBounds, {
            padding: [40, 40],
            maxZoom: 12
        });
    }
</script>

{% endblock %}
