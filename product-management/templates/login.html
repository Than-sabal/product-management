<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>ログイン - 商品管理システム</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-5 col-lg-4">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h3 class="text-center mb-4">
                        商品管理システム
                    </h3>

                    <form action="{{ url_for('dashboard') }}">

                        <div class="mb-3">
                            <label class="form-label">
                                ユーザーID
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                placeholder="ユーザーID"
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                パスワード
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                placeholder="パスワード"
                            >
                        </div>

                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                ログイン
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
