{% extends "base.html" %}
{% block title %}
危険物検知情報 - ごみ分別ナビ
{% endblock %}
{% block content %}
<div class="container mt-4">
<h2>⚠️ 危険物検知情報</h2>
<p class="text-muted">ごみ投入口において、センサーが危険物の反応を検知しました。</p>
<!-- 検知詳細 ＆ 警告表示 -->
<div class="card shadow-sm mt-4">
<div class="card-header bg-warning text-dark fw-bold">
           🚨 新規検知アラート (要確認)
</div>
<div class="card-body">
<div class="mb-3">
<label class="form-label fw-bold">検知日時</label>
<input type="text" class="form-control bg-white" value="2026/10/14 10:15" readonly>
</div>
<div class="mb-3">
<label class="form-label fw-bold">設置場所（危険物あり）</label>
<input type="text" class="form-control bg-white fw-bold text-danger" value="A地区 ごみ投入口" readonly>
</div>

<div class="mb-4">
<label class="form-label fw-bold">判定ステータス</label>
<div class="alert alert-danger fs-5 fw-bold text-center m-0" role="alert">
                   ⚠️ 危険物の可能性があります
</div>

<a href="{{ url_for('products') }}" class="btn btn-secondary">トップへ戻る</a>
</div>
</div>
</div>
{% endblock %}
